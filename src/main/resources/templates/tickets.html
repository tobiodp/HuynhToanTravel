<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Đặt Vé Tham Quan - Huỳnh Toàn Travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <link rel="stylesheet" th:href="@{/css/design.css}">
    <style>
        body { font-family: 'Inter', sans-serif; background: #031f32; color: #fff; }
        .input-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
        .input-glass:focus { outline: none; border-color: rgba(245,158,11,0.5); background: rgba(255,255,255,0.1); }
        .swal2-popup { background: #050e1c !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 24px !important; }
        .swal2-title { color: #fff !important; }
    </style>
</head>
<body>
<div class="scroll-progress"></div>
<header class="site-header">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6">
    <a href="/" class="font-black text-xl flex items-center gap-2">
      <span class="text-gradient-gold">HUYNH TOAN</span>
      <span class="text-white/90">TRAVEL</span>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a href="/booking/vehicle" class="nav-link">Đặt Xe</a>
      <a href="/tickets" class="nav-link">Vé Tham Quan</a>
      <a href="/hotels" class="nav-link">Khách Sạn</a>
    </nav>
    <div class="hidden md:flex items-center gap-3">
        <div th:if="${isLoggedIn}" class="flex items-center gap-3">
            <a th:if="${isAdmin}" href="/admin" class="nav-link text-amber-400 font-bold flex items-center gap-1.5 bg-amber-400/10 border border-amber-400/30 px-3.5 py-1.5 rounded-xl hover:bg-amber-400/20 transition">
                <span>👑</span> Admin
            </a>
            <span class="text-xs font-semibold text-slate-300 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span th:text="${currentUserEmail}">user@gmail.com</span>
            </span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 border border-rose-500/20 px-3 py-1.5 rounded-xl hover:bg-rose-500/20 transition">Đăng xuất</button>
            </form>
        </div>
        <div th:if="${!isLoggedIn}" class="flex items-center gap-3">
            <a href="/register" class="text-xs font-bold text-slate-300 hover:text-amber-400 transition py-2">Đăng ký</a>
            <a href="/login" class="btn-cta btn-cta-glass py-2 px-4 text-sm">
                <span class="shine-sweep"></span>Đăng nhập
            </a>
        </div>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-6 py-32">
    <a href="javascript:history.back()" class="flex items-center gap-2 text-slate-400 hover:text-amber-400 transition text-sm font-semibold mb-6">← Quay lại</a>
    
    <div class="text-center mb-16" data-aos="fade-up">
        <div class="hero-eyebrow mb-4"><span>🎟</span> TRẢI NGHIỆM ĐỈNH CAO</div>
        <h1 class="section-heading">Vé Tham Quan & Giải Trí</h1>
        <p class="mt-4 text-slate-400 text-lg">Chọn các loại vé bạn muốn đặt, kèm ngày sử dụng và số lượng tương ứng.</p>
    </div>

    <form id="bookingForm" class="mt-8 space-y-10">
        <div id="ticketList" class="grid gap-6 sm:grid-cols-2" data-aos="fade-up" data-aos-delay="100">
            <div class="col-span-full text-center text-amber-400 font-bold">Đang tải danh sách vé...</div>
        </div>

        <div class="bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur shadow-2xl" data-aos="fade-up" data-aos-delay="200">
            <h3 class="font-black text-2xl text-white mb-6">Thông tin bổ sung</h3>
            <div class="grid gap-6 md:grid-cols-2">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-bold text-slate-300">Ngày sử dụng vé <span class="text-red-400">*</span></label>
                        <div class="flex gap-2 text-xs">
                            <button type="button" onclick="setTicketDate(0)" class="text-amber-400 hover:underline">Hôm nay</button>
                            <span class="text-slate-600">•</span>
                            <button type="button" onclick="setTicketDate(1)" class="text-amber-400 hover:underline">Ngày mai</button>
                            <span class="text-slate-600">•</span>
                            <button type="button" onclick="setTicketDate(2)" class="text-amber-400 hover:underline">Ngày kia</button>
                        </div>
                    </div>
                    <div class="relative">
                        <input type="text" id="serviceDate" required readonly placeholder="Chọn ngày đi tham quan..." class="input-glass rounded-xl pl-11 pr-4 py-3 w-full cursor-pointer font-bold text-white text-sm focus:border-amber-400">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-amber-400 pointer-events-none text-base">📅</span>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Ghi chú thêm</label>
                    <textarea id="customerNote" rows="1" placeholder="Ví dụ: Cần xuất hóa đơn VAT..." class="input-glass rounded-xl px-4 py-3 w-full h-[46px]"></textarea>
                </div>
            </div>
            
            <div class="mt-8 flex flex-col md:flex-row items-center justify-between bg-black/20 rounded-2xl p-6 border border-white/5">
                <div class="mb-4 md:mb-0">
                    <span class="text-slate-400 font-bold block mb-1">Tổng thanh toán:</span>
                    <span id="priceDisplay" class="text-4xl font-black text-gradient-gold">0 ₫</span>
                </div>
                
                <button type="submit" id="submitBtn" disabled class="btn-cta btn-cta-gold w-full md:w-auto px-10 py-4 text-lg justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="shine-sweep"></span>Vui lòng chọn ít nhất 1 vé
                </button>
            </div>
        </div>
    </form>
</main>

<script>
    let rates = [];
    const ticketListEl = document.getElementById('ticketList');
    const priceDisplay = document.getElementById('priceDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const formatMoney = (n) => new Intl.NumberFormat('vi-VN').format(n) + ' ₫';

    fetch('/api/ticket-rates')
        .then(res => res.json())
        .then(data => {
            rates = data;
            renderTickets();
        });

    function renderTickets() {
        ticketListEl.innerHTML = '';
        rates.forEach((rate, i) => {
            const hasLocal = rate.localPrice != null;
            const card = document.createElement('div');
            card.className = "flex flex-col justify-between rounded-3xl bg-white/5 border border-white/10 p-6 backdrop-blur transition hover:border-amber-400/40 hover:-translate-y-1 duration-300";
            card.setAttribute('data-tilt', '');
            card.innerHTML = `
                <div>
                    <h3 class="font-black text-xl text-white leading-tight">${rate.name}</h3>
                    <p class="mt-3 text-sm text-slate-400 leading-relaxed">${rate.description}</p>
                    <div class="mt-5 font-black text-gradient-gold text-3xl">${formatMoney(rate.price)}</div>
                    ${hasLocal ? `<div class="text-xs text-emerald-400 font-bold mt-3 bg-emerald-500/10 border border-emerald-500/30 inline-block px-3 py-1.5 rounded-lg">Vé địa phương: ${formatMoney(rate.localPrice)}</div>` : ''}
                </div>
                
                <div class="mt-8 border-t border-white/10 pt-6 flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-300">Số lượng:</span>
                        <div class="flex items-center gap-4">
                            <button type="button" onclick="updateQty(${i}, -1)" class="grid h-10 w-10 place-items-center rounded-full bg-white/10 font-black text-white hover:bg-amber-400/20 transition">-</button>
                            <span id="qty-${i}" class="w-8 text-center font-black text-xl text-white">0</span>
                            <button type="button" onclick="updateQty(${i}, 1)" class="grid h-10 w-10 place-items-center rounded-full bg-white/10 font-black text-white hover:bg-amber-400/20 transition">+</button>
                        </div>
                    </div>
                    ${hasLocal ? `
                    <label class="flex items-start gap-3 cursor-pointer mt-3 p-3 rounded-xl border border-white/10 hover:bg-white/10 transition">
                        <input type="checkbox" id="local-${i}" onchange="recalc()" class="mt-0.5 w-5 h-5 accent-amber-500 rounded bg-white/10 border-white/20 cursor-pointer">
                        <span class="text-xs text-slate-400 font-medium leading-relaxed">Áp dụng giá cho khách địa phương (Cần CCCD Đà Nẵng/Quảng Nam khi đổi vé)</span>
                    </label>
                    ` : ''}
                </div>
            `;
            ticketListEl.appendChild(card);
            rate.selectedQty = 0;
        });

        // Khôi phục bản nháp nếu khách vừa đăng nhập quay lại
        const savedDraft = sessionStorage.getItem('ticket_booking_draft');
        if (savedDraft) {
            try {
                const draft = JSON.parse(savedDraft);
                if (draft.serviceDate && typeof ticketFp !== 'undefined') {
                    ticketFp.setDate(draft.serviceDate, true);
                }
                if (draft.customerNote) {
                    document.getElementById('customerNote').value = draft.customerNote;
                }
                if (Array.isArray(draft.ratesState)) {
                    draft.ratesState.forEach(item => {
                        const r = rates.find(x => x.ticketType === item.ticketType);
                        if (r && item.qty > 0) {
                            r.selectedQty = item.qty;
                            const idx = rates.indexOf(r);
                            const qEl = document.getElementById(`qty-${idx}`);
                            if (qEl) qEl.textContent = item.qty;
                            const locEl = document.getElementById(`local-${idx}`);
                            if (locEl && item.isLocal) locEl.checked = true;
                        }
                    });
                }
                sessionStorage.removeItem('ticket_booking_draft');
                recalc();

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('resume') === '1') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đã khôi phục các vé đã chọn',
                        text: 'Tất cả loại vé và ngày đi của bạn được giữ nguyên. Bấm Xác nhận đặt vé để hoàn tất thanh toán!',
                        timer: 2500,
                        showConfirmButton: false
                    });
                }
            } catch(e) {}
        }

        if(typeof VanillaTilt !== 'undefined') VanillaTilt.init(document.querySelectorAll('[data-tilt]'), {max: 5, speed: 400});
    }

    window.updateQty = (index, delta) => {
        const rate = rates[index];
        let q = rate.selectedQty + delta;
        if (q < 0) q = 0;
        if (q > 50) q = 50;
        rate.selectedQty = q;
        document.getElementById(`qty-${index}`).textContent = q;
        recalc();
    };

    window.recalc = () => {
        let total = 0;
        let count = 0;
        rates.forEach((rate, i) => {
            if (rate.selectedQty > 0) {
                const isLocal = rate.localPrice != null && document.getElementById(`local-${i}`)?.checked;
                const unitPrice = isLocal ? rate.localPrice : rate.price;
                total += unitPrice * rate.selectedQty;
                count += rate.selectedQty;
            }
        });
        priceDisplay.textContent = formatMoney(total);
        if (count > 0) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="shine-sweep"></span>Xác nhận đặt vé & Thanh toán';
        } else {
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Vui lòng chọn ít nhất 1 vé';
        }
    };

    document.getElementById('bookingForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const serviceDate = document.getElementById('serviceDate').value;
        if(!serviceDate) return Swal.fire('Lỗi', 'Vui lòng chọn ngày sử dụng vé', 'warning');
        
        const items = rates.filter(r => r.selectedQty > 0).map((r, i) => ({
            ticketType: r.ticketType,
            quantity: r.selectedQty,
            serviceDate: serviceDate,
            localResident: r.localPrice != null ? (document.getElementById(`local-${i}`)?.checked || false) : false
        }));

        if (items.length === 0) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="shine-sweep"></span>Đang xử lý đặt vé...';

        const payload = {
            customerNote: document.getElementById('customerNote').value,
            items: items
        };

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        const res = await fetch('/api/bookings/ticket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify(payload)
        });

        if (res.status === 401 || res.redirected || (res.url && res.url.includes('/login'))) {
            const draft = {
                serviceDate: serviceDate,
                customerNote: document.getElementById('customerNote').value,
                ratesState: rates.map((r, i) => ({
                    ticketType: r.ticketType,
                    qty: r.selectedQty || 0,
                    isLocal: document.getElementById(`local-${i}`)?.checked || false
                }))
            };
            sessionStorage.setItem('ticket_booking_draft', JSON.stringify(draft));
            Swal.fire({
                title: 'Yêu cầu đăng nhập để thanh toán',
                html: 'Các loại vé bạn vừa chọn đã được lưu lại.<br>Vui lòng đăng nhập hoặc đăng ký tài khoản để tiếp tục thanh toán.',
                icon: 'info',
                confirmButtonText: 'Đăng nhập / Đăng ký ngay',
                confirmButtonColor: '#f59e0b',
                showCancelButton: true,
                cancelButtonText: 'Để sau'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/login?redirect=' + encodeURIComponent('/tickets?resume=1');
                }
            });
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="shine-sweep"></span>Xác nhận đặt vé & Thanh toán';
            return;
        }
        if (res.status === 403) {
            Swal.fire('Lỗi', 'Phiên làm việc hết hạn hoặc không có quyền.', 'error');
            submitBtn.disabled = false; submitBtn.innerHTML = '<span class="shine-sweep"></span>Xác nhận đặt vé & Thanh toán';
            return;
        }

        const rawText = await res.text();
        let data = {};
        try {
            data = JSON.parse(rawText);
        } catch(e) {
            if (rawText.includes('<!doctype') || rawText.includes('<html')) {
                const draft = {
                    serviceDate: serviceDate,
                    customerNote: document.getElementById('customerNote').value,
                    ratesState: rates.map((r, i) => ({
                        ticketType: r.ticketType,
                        qty: r.selectedQty || 0,
                        isLocal: document.getElementById(`local-${i}`)?.checked || false
                    }))
                };
                sessionStorage.setItem('ticket_booking_draft', JSON.stringify(draft));
                window.location.href = '/login?redirect=' + encodeURIComponent('/tickets?resume=1');
                return;
            }
        }

        if (res.ok && data.bookingCode) {
            window.location.href = '/checkout/' + data.bookingCode;
        } else {
            Swal.fire('Lỗi', data.error || 'Có lỗi xảy ra', 'error');
            submitBtn.disabled = false; submitBtn.innerHTML = '<span class="shine-sweep"></span>Xác nhận đặt vé & Thanh toán';
        }
    };
    
    const ticketFp = flatpickr("#serviceDate", {
        locale: "vn",
        minDate: "today",
        defaultDate: new Date(),
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "l, d/m/Y",
        altInputClass: "input-glass rounded-xl pl-11 pr-4 py-3 w-full cursor-pointer font-bold text-white text-sm focus:border-amber-400"
    });

    window.setTicketDate = function(offsetDays) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        ticketFp.setDate(d, true);
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.32/bundled/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
